baseURL = 'https://informatux.net/'
locale = 'en-us'
title = 'tail -f /var/log/life'

[services.googleAnalytics]
ID = "G-H7H8GV69T0"

[module]
[[module.imports]]
disable = false
ignoreConfig = false
ignoreImports = false
path = 'github.com/gohugo-ananke/ananke/v2'

[markup.goldmark.renderer]
unsafe = true

[params]
#site_logo = "img/logo.svg"
date_format = "2. January 2006"

[params.ananke]
show_categories = true
show_tags = true

[ananke]
show_recent_posts = true # show recent posts on the homepage
show_categories = true # show categories terms on single pages
copy_code = true 

[ananke.social.networks.twitter]
slug = "twitter"
label = "Twitter"
color = "#1da1f2"
profile = "https://twitter.com/%s"
icon = "twitter" # font awesome brand icon name
link = "https://twitter.com/intent/tweet/"
[ananke.social.networks.twitter.particles]
text = "description"
url = "permalink"


[menus]
[[menus.main]]
name = "Kwame"
url = "/about/"
weight = 10

[[menus.main]]
name = "Posts"
url = "/posts/"
weight = 20

[[menus.main]]
name = "Categories" 
url = "/categories/"
weight = 30

[[menus.main]]
name = "Tags" 
url = "/tags/"
weight = 40

[[menus.main]]
name = "Projects"
url = "/projects/"
weight = 50


[permalinks]
  posts = "/:year/:month/:slug/"
